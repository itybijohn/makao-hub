<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makao Digital Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- LOGIN/REGISTER VIEW -->
    <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-indigo-600">Makao Hub</h1>
                <p class="text-gray-500 mt-2">Your Digital Property Partner</p>
            </div>
            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-medium">Sign In</button>
                <p id="error-msg" class="text-red-500 text-sm text-center hidden"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    New here? <a href="#" onclick="showRegister()" class="text-indigo-600 hover:underline font-semibold">Create an account</a>
                </p>
            </form>
            <!-- Register Form -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="reg-username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="reg-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">I am a...</label>
                    <select id="reg-role" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="landlord">Landlord (I own properties)</option>
                        <option value="tenant">Tenant (I want to rent)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 font-medium">Create Account</button>
                <p id="reg-error-msg" class="text-red-500 text-sm text-center hidden"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Have an account? <a href="#" onclick="showLogin()" class="text-indigo-600 hover:underline font-semibold">Sign in</a>
                </p>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden min-h-screen">
        <!-- LANDLORD THEME: Indigo/Blue -->
        <nav id="landlord-nav" class="bg-indigo-600 text-white shadow-lg hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <span class="text-xl font-bold">Makao Hub - Landlord</span>
                    <div class="flex items-center space-x-4">
                        <span id="landlord-badge" class="text-sm bg-indigo-800 px-3 py-1 rounded-full uppercase tracking-wide">Landlord</span>
                        <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded-md text-sm font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- TENANT THEME: Green/Teal -->
        <nav id="tenant-nav" class="bg-emerald-600 text-white shadow-lg hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <span class="text-xl font-bold">Makao Hub - Tenant</span>
                    <div class="flex items-center space-x-4">
                        <span id="tenant-badge" class="text-sm bg-emerald-800 px-3 py-1 rounded-full uppercase tracking-wide">Tenant</span>
                        <button onclick="logout()" class="bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-md text-sm font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Navigation Tabs -->
            <div class="flex space-x-4 mb-8 border-b border-gray-200">
                <button onclick="switchTab('properties')" id="tab-properties" class="tab-btn py-2 px-4 border-b-2 border-indigo-600 text-indigo-600 font-medium">My Properties</button>
                <button onclick="switchTab('browse')" id="tab-browse" class="tab-btn py-2 px-4 text-gray-500 hover:text-gray-700">Browse Homes</button>
                <button onclick="switchTab('applications')" id="tab-applications" class="tab-btn py-2 px-4 text-gray-500 hover:text-gray-700 relative">
                    Applications
                    <span id="notification-badge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"></span>
                </button>
            </div>

            <!-- TAB 1: MY PROPERTIES (Landlord) -->
            <div id="view-properties" class="tab-content">
                <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Add New Property</h3>
                    <form id="add-property-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="prop-title" placeholder="Title (e.g. 2BR in Kilimani)" class="px-3 py-2 border rounded-md" required>
                        <input type="text" id="prop-location" placeholder="Location" class="px-3 py-2 border rounded-md" required>
                        <input type="number" id="prop-rent" placeholder="Rent (KES)" class="px-3 py-2 border rounded-md" required>
                        <input type="number" id="prop-beds" placeholder="Bedrooms" class="px-3 py-2 border rounded-md" required>
                        <textarea id="prop-description" placeholder="Description" rows="2" class="md:col-span-2 px-3 py-2 border rounded-md"></textarea>
                        <button type="submit" class="md:col-span-2 bg-green-600 text-white py-2 rounded-md hover:bg-green-700">+ Add Property</button>
                    </form>
                </div>
                <div id="my-properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- TAB 2: BROWSE HOMES (Tenant) -->
            <div id="view-browse" class="tab-content hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Available Properties</h2>
                <div id="browse-properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- TAB 3: APPLICATIONS (Landlord & Tenant) -->
            <div id="view-applications" class="tab-content hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Applications</h2>
                <div id="applications-list" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <script>
        const API = '';
        let currentUserRole = 'landlord';

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('makao_token');
            currentUserRole = localStorage.getItem('makao_role') || 'landlord';
            if (token) {
                showDashboard();
            }
        });

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('reg-username').value,
                password: document.getElementById('reg-password').value,
                role: document.getElementById('reg-role').value
            };
            try {
                const res = await fetch(`${API}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error((await res.json()).detail);
                alert('Account created! Please log in.');
                showLogin();
            } catch (err) {
                document.getElementById('reg-error-msg').textContent = err.message;
                document.getElementById('reg-error-msg').classList.remove('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            try {
                const res = await fetch(`${API}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Invalid credentials');
                const result = await res.json();
                localStorage.setItem('makao_token', result.access_token);
                localStorage.setItem('makao_role', result.role);
                currentUserRole = result.role;
                showDashboard();
            } catch (err) {
                document.getElementById('error-msg').textContent = err.message;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            // Apply theme based on role
            if (currentUserRole === 'tenant') {
                document.getElementById('tenant-nav').classList.remove('hidden');
                document.getElementById('landlord-nav').classList.add('hidden');
                document.getElementById('tab-properties').style.display = 'none';
                switchTab('browse');
            } else {
                document.getElementById('landlord-nav').classList.remove('hidden');
                document.getElementById('tenant-nav').classList.add('hidden');
                document.getElementById('tab-properties').style.display = 'block';
                switchTab('properties');
            }
            
            checkNotifications();
        }

        async function checkNotifications() {
            if (currentUserRole !== 'landlord') return;
            const token = localStorage.getItem('makao_token');
            try {
                const res = await fetch(`${API}/api/v1/notifications/unread`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const badge = document.getElementById('notification-badge');
                if (data.unread_count > 0) {
                    badge.textContent = data.unread_count;
                    badge.classList.remove('hidden');
                    badge.classList.add('flex');
                } else {
                    badge.classList.add('hidden');
                }
            } catch (err) {
                console.error('Notification check failed', err);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-b-2', 'border-indigo-600', 'text-indigo-600', 'font-medium');
                el.classList.add('text-gray-500');
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const btn = document.getElementById(`tab-${tabName}`);
            if(btn) {
                btn.classList.add('border-b-2', 'border-indigo-600', 'text-indigo-600', 'font-medium');
                btn.classList.remove('text-gray-500');
            }
            
            if (tabName === 'properties') loadMyProperties();
            if (tabName === 'browse') loadBrowseProperties();
            if (tabName === 'applications') {
                loadApplications();
                document.getElementById('notification-badge').classList.add('hidden');
            }
        }

        async function loadMyProperties() {
            const token = localStorage.getItem('makao_token');
            const res = await fetch(`${API}/api/v1/dashboard/landlord`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            renderGrid('my-properties-grid', data.my_properties || [], false);
        }

        async function loadBrowseProperties() {
            const res = await fetch(`${API}/api/v1/properties`);
            const data = await res.json();
            renderGrid('browse-properties-grid', data, true);
        }

        async function loadApplications() {
            const token = localStorage.getItem('makao_token');
            if (currentUserRole === 'landlord') {
                const res = await fetch(`${API}/api/v1/landlord/applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                renderLandlordApps(await res.json());
            } else {
                const res = await fetch(`${API}/api/v1/tenant/applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                renderTenantApps(await res.json());
            }
        }

        function renderGrid(containerId, properties, isBrowseMode) {
            const container = document.getElementById(containerId);
            container.innerHTML = properties.length ? '' : '<p class="text-gray-500 col-span-3 text-center">No properties found.</p>';
            properties.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md p-6';
                card.innerHTML = `
                    <h3 class="text-lg font-bold">${p.title}</h3>
                    <p class="text-gray-600 text-sm">📍 ${p.location}</p>
                    <p class="text-indigo-600 font-bold mt-2">KES ${p.rent_amount.toLocaleString()}/mo</p>
                    <p class="text-sm text-gray-500 mt-2">${p.description || ''}</p>
                    ${isBrowseMode ? `<button onclick="applyForProperty('${p.id}')" class="mt-4 w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">Apply Now</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderLandlordApps(apps) {
            const container = document.getElementById('applications-list');
            container.innerHTML = apps.length ? '' : '<p class="text-gray-500">No applications yet.</p>';
            apps.forEach(app => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-lg shadow flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold">${app.property_title}</p>
                        <p class="text-sm text-gray-600">Message: "${app.message}"</p>
                        <p class="text-xs mt-1">Status: <span class="font-semibold ${app.status === 'pending' ? 'text-yellow-600' : app.status === 'approved' ? 'text-green-600' : 'text-red-600'}">${app.status}</span></p>
                    </div>
                    ${app.status === 'pending' ? `
                        <div class="space-x-2">
                            <button onclick="updateApp('${app.id}', 'approved')" class="bg-green-500 text-white px-3 py-1 rounded text-sm">Approve</button>
                            <button onclick="updateApp('${app.id}', 'rejected')" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Reject</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderTenantApps(apps) {
            const container = document.getElementById('applications-list');
            container.innerHTML = apps.length ? '' : '<p class="text-gray-500">You haven\'t applied to any properties yet.</p>';
            apps.forEach(app => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-lg shadow flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold">${app.property_title}</p>
                        <p class="text-xs mt-1">Status: <span class="font-semibold ${app.status === 'pending' ? 'text-yellow-600' : app.status === 'approved' ? 'text-green-600' : 'text-red-600'}">${app.status}</span></p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function applyForProperty(propertyId) {
            const token = localStorage.getItem('makao_token');
            const message = prompt("Send a message to the landlord:");
            if (!message) return;
            try {
                const res = await fetch(`${API}/api/v1/applications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ property_id: propertyId, message })
                });
                if (!res.ok) throw new Error((await res.json()).detail);
                alert('Application sent successfully!');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function updateApp(appId, status) {
            const token = localStorage.getItem('makao_token');
            await fetch(`${API}/api/v1/landlord/applications/${appId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            loadApplications();
            checkNotifications();
        }

        document.getElementById('add-property-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('makao_token');
            const data = {
                title: document.getElementById('prop-title').value,
                location: document.getElementById('prop-location').value,
                rent_amount: parseFloat(document.getElementById('prop-rent').value),
                bedrooms: parseInt(document.getElementById('prop-beds').value),
                description: document.getElementById('prop-description').value
            };
            await fetch(`${API}/api/v1/landlord/properties`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            e.target.reset();
            loadMyProperties();
        });
    </script>
</body>
</html>
