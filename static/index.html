<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makao Digital Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); opacity: 0.8; }
            50% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(0px); opacity: 0.8; }
        }
        .ai-float { animation: float 3s ease-in-out infinite; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-indigo-600">Makao Hub</h1>
                <p class="text-gray-500 mt-2">Your Digital Property Partner</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-medium">Sign In</button>
                <p id="error-msg" class="text-red-500 text-sm text-center hidden"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    New here? <a href="#" onclick="showRegister()" class="text-indigo-600 hover:underline font-semibold">Create an account</a>
                </p>
            </form>
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="reg-username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="reg-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">I am a...</label>
                    <select id="reg-role" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="landlord">Landlord (I own properties)</option>
                        <option value="tenant">Tenant (I want to rent)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 font-medium">Create Account</button>
                <p id="reg-error-msg" class="text-red-500 text-sm text-center hidden"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Have an account? <a href="#" onclick="showLogin()" class="text-indigo-600 hover:underline font-semibold">Sign in</a>
                </p>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden min-h-screen">
        <nav id="landlord-nav" class="bg-indigo-600 text-white shadow-lg hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <span class="text-xl font-bold">Makao Hub - Landlord</span>
                    <div class="flex items-center space-x-4">
                        <span id="landlord-badge" class="text-sm bg-indigo-800 px-3 py-1 rounded-full uppercase tracking-wide">Landlord</span>
                        <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded-md text-sm font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <nav id="tenant-nav" class="bg-emerald-600 text-white shadow-lg hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <span class="text-xl font-bold">Makao Hub - Tenant</span>
                    <div class="flex items-center space-x-4">
                        <span id="tenant-badge" class="text-sm bg-emerald-800 px-3 py-1 rounded-full uppercase tracking-wide">Tenant</span>
                        <button onclick="logout()" class="bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-md text-sm font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex space-x-4 mb-8 border-b border-gray-200">
                <button onclick="switchTab('properties')" id="tab-properties" class="tab-btn py-2 px-4 border-b-2 border-indigo-600 text-indigo-600 font-medium">My Properties</button>
                <button onclick="switchTab('browse')" id="tab-browse" class="tab-btn py-2 px-4 text-gray-500 hover:text-gray-700">Browse Homes</button>
                <button onclick="switchTab('applications')" id="tab-applications" class="tab-btn py-2 px-4 text-gray-500 hover:text-gray-700 relative">
                    Applications
                    <span id="notification-badge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"></span>
                </button>
            </div>

            <div id="view-properties" class="tab-content">
                <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Add New Property</h3>
                    <form id="add-property-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="prop-title" placeholder="Title (e.g. 2BR in Kilimani)" class="px-3 py-2 border rounded-md" required>
                        <input type="text" id="prop-location" placeholder="Location" class="px-3 py-2 border rounded-md" required>
                        <input type="number" id="prop-rent" placeholder="Rent (KES)" class="px-3 py-2 border rounded-md" required>
                        <input type="number" id="prop-beds" placeholder="Bedrooms" class="px-3 py-2 border rounded-md" required>
                        <input type="text" id="prop-image" placeholder="Image URL (optional)" class="md:col-span-2 px-3 py-2 border rounded-md">
                        <div class="grid grid-cols-2 gap-4 md:col-span-2">
                            <input type="number" step="any" id="prop-lat" placeholder="Latitude (e.g., -1.2921)" class="px-3 py-2 border rounded-md">
                            <input type="number" step="any" id="prop-lng" placeholder="Longitude (e.g., 36.8219)" class="px-3 py-2 border rounded-md">
                        </div>
                        <textarea id="prop-description" placeholder="Description" rows="2" class="md:col-span-2 px-3 py-2 border rounded-md"></textarea>
                        <button type="submit" class="md:col-span-2 bg-green-600 text-white py-2 rounded-md hover:bg-green-700">+ Add Property</button>
                    </form>
                </div>
                <div id="my-properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-browse" class="tab-content hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Available Properties</h2>
                <div id="browse-properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-applications" class="tab-content hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Applications</h2>
                <div id="applications-list" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <div id="booking-modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="bg-indigo-600 p-4 flex justify-between items-center">
                <h3 class="text-white font-bold text-lg">Book a House Tour</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-200 text-2xl">&times;</button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-4">Select a date and time for your viewing.</p>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Date</label>
                    <input type="date" id="booking-date" class="w-full px-3 py-2 border rounded-md" min="">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Available Times</label>
                    <div id="time-slots" class="grid grid-cols-3 gap-2"></div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message to Landlord (Optional)</label>
                    <textarea id="booking-message" rows="2" class="w-full px-3 py-2 border rounded-md" placeholder="Hi, I'm interested..."></textarea>
                </div>
                <button onclick="submitBooking()" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 font-medium">Confirm Booking</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-40">
        <button class="ai-float bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 rounded-full shadow-lg hover:shadow-xl transition-all flex items-center justify-center group" onclick="toggleAI()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
            <span class="absolute right-full mr-3 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Ask Makao AI</span>
        </button>
    </div>

    <script>
        const API = '';
        let currentUserRole = 'landlord';
        let selectedTime = null;
        let currentPropertyId = null;
        let bookedSlots = [];

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('makao_token');
            currentUserRole = localStorage.getItem('makao_role') || 'landlord';
            if (token) showDashboard();
        });

        function showRegister() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); }
        function showLogin() { document.getElementById('register-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { username: document.getElementById('reg-username').value, password: document.getElementById('reg-password').value, role: document.getElementById('reg-role').value };
            try {
                const res = await fetch(`${API}/api/v1/auth/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                if (!res.ok) throw new Error((await res.json()).detail);
                alert('Account created! Please log in.');
                showLogin();
            } catch (err) { document.getElementById('reg-error-msg').textContent = err.message; document.getElementById('reg-error-msg').classList.remove('hidden'); }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { username: document.getElementById('username').value, password: document.getElementById('password').value };
            try {
                const res = await fetch(`${API}/api/v1/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                if (!res.ok) throw new Error('Invalid credentials');
                const result = await res.json();
                localStorage.setItem('makao_token', result.access_token);
                localStorage.setItem('makao_role', result.role);
                currentUserRole = result.role;
                showDashboard();
            } catch (err) { document.getElementById('error-msg').textContent = err.message; document.getElementById('error-msg').classList.remove('hidden'); }
        });

        function logout() { localStorage.clear(); location.reload(); }

        function showDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            if (currentUserRole === 'tenant') {
                document.getElementById('tenant-nav').classList.remove('hidden');
                document.getElementById('landlord-nav').classList.add('hidden');
                document.getElementById('tab-properties').style.display = 'none';
                switchTab('browse');
            } else {
                document.getElementById('landlord-nav').classList.remove('hidden');
                document.getElementById('tenant-nav').classList.add('hidden');
                document.getElementById('tab-properties').style.display = 'block';
                switchTab('properties');
            }
            checkNotifications();
        }

        async function checkNotifications() {
            if (currentUserRole !== 'landlord') return;
            const token = localStorage.getItem('makao_token');
            try {
                const res = await fetch(`${API}/api/v1/notifications/unread`, { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('notification-badge');
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.classList.remove('hidden');
                        badge.classList.add('flex');
                    } else { badge.classList.add('hidden'); }
                }
            } catch (err) { console.error('Notification check failed', err); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => { el.classList.remove('border-b-2', 'border-indigo-600', 'text-indigo-600', 'font-medium'); el.classList.add('text-gray-500'); });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const btn = document.getElementById(`tab-${tabName}`);
            if(btn) { btn.classList.add('border-b-2', 'border-indigo-600', 'text-indigo-600', 'font-medium'); btn.classList.remove('text-gray-500'); }
            if (tabName === 'properties') loadMyProperties();
            if (tabName === 'browse') loadBrowseProperties();
            if (tabName === 'applications') { loadApplications(); document.getElementById('notification-badge').classList.add('hidden'); }
        }

        async function loadMyProperties() {
            const token = localStorage.getItem('makao_token');
            const res = await fetch(`${API}/api/v1/dashboard/landlord`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            renderGrid('my-properties-grid', data.my_properties || [], false);
        }

        async function loadBrowseProperties() {
            const res = await fetch(`${API}/api/v1/properties`);
            const data = await res.json();
            renderGrid('browse-properties-grid', data, true);
        }

        async function loadApplications() {
            const token = localStorage.getItem('makao_token');
            if (currentUserRole === 'landlord') {
                const res = await fetch(`${API}/api/v1/landlord/applications`, { headers: { 'Authorization': `Bearer ${token}` } });
                renderLandlordApps(await res.json());
            } else {
                const res = await fetch(`${API}/api/v1/tenant/applications`, { headers: { 'Authorization': `Bearer ${token}` } });
                renderTenantApps(await res.json());
            }
        }

        function renderGrid(containerId, properties, isBrowseMode) {
            const container = document.getElementById(containerId);
            container.innerHTML = properties.length ? '' : '<p class="text-gray-500 col-span-3 text-center">No properties found.</p>';
            properties.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md overflow-hidden flex flex-col';
                
                const imageHtml = p.image_url 
                    ? `<img src="${p.image_url}" alt="${p.title}" class="w-full h-48 object-cover">` 
                    : `<div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400">No Image Available</div>`;

                // NEW: Map Button Logic
                let mapButton = '';
                if (p.latitude && p.longitude && p.latitude !== 0 && p.longitude !== 0) {
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${p.latitude},${p.longitude}`;
                    mapButton = `<a href="${mapUrl}" target="_blank" class="block w-full text-center mt-2 bg-blue-100 text-blue-700 py-2 rounded hover:bg-blue-200 font-medium text-sm">📍 View on Map</a>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="p-6 flex-grow">
                        <h3 class="text-lg font-bold">${p.title}</h3>
                        <p class="text-gray-600 text-sm">📍 ${p.location}</p>
                        <p class="text-indigo-600 font-bold mt-2">KES ${p.rent_amount.toLocaleString()}/mo</p>
                        <p class="text-sm text-gray-500 mt-2 line-clamp-3">${p.description || ''}</p>
                        ${mapButton}
                    </div>
                    <div class="p-6 pt-0">
                        ${isBrowseMode ? `<button onclick="openBookingModal('${p.id}')" class="w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">Book Tour</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLandlordApps(apps) {
            const container = document.getElementById('applications-list');
            container.innerHTML = apps.length ? '' : '<p class="text-gray-500">No applications yet.</p>';
            apps.forEach(app => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-lg shadow flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold">${app.property_title}</p>
                        <p class="text-sm text-gray-600">Message: "${app.message}"</p>
                        ${app.booking_date ? `<p class="text-xs text-indigo-600 mt-1">📅 Booked: ${app.booking_date} at ${app.booking_time}</p>` : ''}
                        <p class="text-xs mt-1">Status: <span class="font-semibold ${app.status === 'pending' ? 'text-yellow-600' : app.status === 'approved' ? 'text-green-600' : 'text-red-600'}">${app.status}</span></p>
                    </div>
                    ${app.status === 'pending' ? `
                        <div class="space-x-2">
                            <button onclick="updateApp('${app.id}', 'approved')" class="bg-green-500 text-white px-3 py-1 rounded text-sm">Approve</button>
                            <button onclick="updateApp('${app.id}', 'rejected')" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Reject</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderTenantApps(apps) {
            const container = document.getElementById('applications-list');
            container.innerHTML = apps.length ? '' : '<p class="text-gray-500">You haven\'t applied to any properties yet.</p>';
            apps.forEach(app => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-lg shadow flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold">${app.property_title}</p>
                        ${app.booking_date ? `<p class="text-xs text-indigo-600 mt-1">📅 Tour: ${app.booking_date} at ${app.booking_time}</p>` : ''}
                        <p class="text-xs mt-1">Status: <span class="font-semibold ${app.status === 'pending' ? 'text-yellow-600' : app.status === 'approved' ? 'text-green-600' : 'text-red-600'}">${app.status}</span></p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function openBookingModal(propertyId) {
            currentPropertyId = propertyId;
            selectedTime = null;
            document.getElementById('booking-modal').classList.remove('hidden');
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('booking-date').min = today;
            document.getElementById('booking-date').value = today;
            const token = localStorage.getItem('makao_token');
            const res = await fetch(`${API}/api/v1/properties/${propertyId}/bookings`, { headers: { 'Authorization': `Bearer ${token}` } });
            if(res.ok) { bookedSlots = await res.json(); } else { bookedSlots = []; }
            generateTimeSlots();
        }

        function closeModal() { document.getElementById('booking-modal').classList.add('hidden'); }

        function generateTimeSlots() {
            const container = document.getElementById('time-slots');
            container.innerHTML = '';
            const times = ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM'];
            const selectedDate = document.getElementById('booking-date').value;
            const bookedTimesForDate = bookedSlots.filter(b => b.date === selectedDate).map(b => b.time);
            times.forEach(time => {
                const isBooked = bookedTimesForDate.includes(time);
                const btn = document.createElement('button');
                btn.className = `py-2 px-3 rounded text-sm font-medium border ${isBooked ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-50'}`;
                btn.textContent = time;
                btn.disabled = isBooked;
                if (!isBooked) { btn.onclick = () => selectTime(btn, time); }
                container.appendChild(btn);
            });
        }

        function selectTime(btn, time) {
            document.querySelectorAll('#time-slots button:not(:disabled)').forEach(b => {
                b.className = 'py-2 px-3 rounded text-sm font-medium border bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-50';
            });
            btn.className = 'py-2 px-3 rounded text-sm font-medium border bg-indigo-600 text-white border-indigo-600';
            selectedTime = time;
        }

        document.getElementById('booking-date').addEventListener('change', generateTimeSlots);

        async function submitBooking() {
            if (!selectedTime) { alert('Please select a time slot.'); return; }
            const date = document.getElementById('booking-date').value;
            const message = document.getElementById('booking-message').value;
            const token = localStorage.getItem('makao_token');
            try {
                const res = await fetch(`${API}/api/v1/applications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ property_id: currentPropertyId, message, booking_date: date, booking_time: selectedTime })
                });
                if (!res.ok) throw new Error((await res.json()).detail);
                alert('Tour booked successfully!');
                closeModal();
            } catch (err) { alert('Error: ' + err.message); }
        }

        async function updateApp(appId, status) {
            const token = localStorage.getItem('makao_token');
            await fetch(`${API}/api/v1/landlord/applications/${appId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            loadApplications();
            checkNotifications();
        }

        document.getElementById('add-property-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('makao_token');
            const data = {
                title: document.getElementById('prop-title').value,
                location: document.getElementById('prop-location').value,
                rent_amount: parseFloat(document.getElementById('prop-rent').value),
                bedrooms: parseInt(document.getElementById('prop-beds').value),
                description: document.getElementById('prop-description').value,
                image_url: document.getElementById('prop-image').value,
                latitude: parseFloat(document.getElementById('prop-lat').value) || 0.0,
                longitude: parseFloat(document.getElementById('prop-lng').value) || 0.0
            };
            await fetch(`${API}/api/v1/landlord/properties`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            e.target.reset();
            loadMyProperties();
        });

        function toggleAI() {
            alert("Makao AI: 'Hello! I can help you find the perfect home or manage your properties. What would you like to know?'");
        }
    </script>
</body>
</html>
